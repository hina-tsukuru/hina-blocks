# SwiftLint 設定（WBS 1.5 / KAN-15）
# 実行: scripts/lint.sh   （CI での実行は Phase 3 で追加する）

included:
  - HinaBlocks

excluded:
  - HinaBlocks/build
  - "**/DerivedData"

# 既定のルールに加えて、クラッシュの原因になりやすい書き方を警告にする
opt_in_rules:
  - force_unwrapping              # ! による強制アンラップ
  - implicitly_unwrapped_optional # 型に ! を付けた宣言
  - empty_count                   # count == 0 ではなく isEmpty を使う
  - first_where                   # filter().first ではなく first(where:)
  - contains_over_first_not_nil
  - sorted_first_last
  - toggle_bool

line_length:
  warning: 140
  error: 200

identifier_name:
  excluded:
    - id
    - x
    - y

reporter: xcode
